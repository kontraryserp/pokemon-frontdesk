  function backupBody() {
    var n = S.tickets.length;
    var b = S.backup;
    return "<h2>" + avatarHTML(null, MASCOT, "fd-title-mon") + "Backup</h2>" +
      '<p class="fd-modal-lead">' + n + " " + (n === 1 ? "ticket" : "tickets") +
        ", open and archived. Keep the file somewhere safe, or load one back in below.</p>" +
      '<div class="fd-modal-row">' +
        '<button class="fd-btn fd-btn-solid" data-act="download">Download</button>' +
        '<button class="fd-btn" data-act="copyJson">' + (S.copied ? "Copied" : "Copy JSON") + "</button>" +
      "</div>" +
      '<label class="fd-field"><span>Restore from a file</span>' +
        '<input type="file" accept="application/json,.json" data-role="importFile"></label>' +
      '<label class="fd-field"><span>Or paste a backup</span>' +
        '<textarea rows="4" placeholder="Paste the contents of a backup file" ' +
        'data-bind="backup.paste" data-role="paste" data-k="paste">' + esc(b.paste) + "</textarea></label>" +
      '<button class="fd-btn" data-act="checkPaste"' + (b.paste.trim() ? "" : " disabled") +
        ">Check this backup</button>" +
      (b.error ? '<p class="fd-modal-error">' + esc(b.error) + "</p>" : "") +
      (b.pending ? '<p class="fd-modal-warn">Found ' + b.pending.length + " " +
        (b.pending.length === 1 ? "ticket" : "tickets") +
        ". Loading replaces everything on the desk right now." +
        '<button class="fd-confirm-yes" data-act="applyImport">Replace</button>' +
        '<button class="fd-confirm-no" data-act="cancelImport">Cancel</button></p>' : "") +
      '<div class="fd-modal-foot"><button class="fd-btn" data-act="closeModal">Close</button></div>';
  }

  /* ---------- render orchestration -------------------------------------- */
  var root, scrolls = {}, pinThread = false, currentModal = null;

  function $(sel, host) { return (host || root).querySelector(sel); }

  function harvest() {
    var bound = root.querySelectorAll("[data-bind]");
    for (var i = 0; i < bound.length; i++) setPath(bound[i].getAttribute("data-bind"), bound[i].value);
  }

  function setPath(path, value) {
    var parts = path.split("."), obj = S;
    for (var i = 0; i < parts.length - 1; i++) {
      if (obj[parts[i]] == null) obj[parts[i]] = {};
      obj = obj[parts[i]];
    }
    obj[parts[parts.length - 1]] = value;
  }

  var SLOTS = {
    top: { sel: "#fd-top", fn: renderTop },
    warn: { sel: "#fd-warn", fn: renderWarn },
    qhead: { sel: "#fd-qhead", fn: renderQueueHead },
    flavors: { sel: "#fd-flavors", fn: renderFlavors },
    list: { sel: "#fd-list", fn: renderList },
    detail: { sel: "#fd-detail", fn: renderDetail },
    foot: { sel: "#fd-foot", fn: renderFoot },
    undo: { sel: "#fd-undo", fn: renderUndo }
  };
  var ALL = ["top", "warn", "qhead", "flavors", "list", "detail", "foot", "undo", "modal"];

  function render(regions) {
    if (!root) return;
    regions = regions || ALL;
    try {
      var active = document.activeElement;
      var focusKey = active && active.getAttribute ? active.getAttribute("data-k") : null;
      var selStart = null, selEnd = null;
      if (focusKey && active.selectionStart != null) {
        selStart = active.selectionStart; selEnd = active.selectionEnd;
      }
      rememberScroll();

      regions.forEach(function (name) {
        if (name === "modal") { renderModal(); return; }
        var slot = SLOTS[name];
        if (!slot) return;
        var host = $(slot.sel);
        if (!host) return;
        host.innerHTML = slot.fn();
        if (name === "detail") {
          var picked = ticketById(S.selected);
          host.setAttribute("style", flavorStyle(picked ? picked.flavor : DEFAULT_FLAVOR));
        }
      });

      root.setAttribute("data-theme", S.theme);
      var app = $("#fd-app");
      if (app) app.setAttribute("data-pane", S.pane);

      restoreScroll();
      if (focusKey) {
        var next = root.querySelector('[data-k="' + focusKey + '"]');
        if (next && next !== document.activeElement) {
          next.focus({ preventScroll: true });
          if (selStart != null && next.setSelectionRange) {
            try { next.setSelectionRange(selStart, selEnd); } catch (e) { /* number inputs */ }
          }
        }
      }
      var composer = root.querySelector('[data-role="composer"]');
      if (composer) grow(composer);
    } catch (err) {
      crash(err);
    }
  }

  function renderModal() {
    var host = $("#fd-layer");
    if (!host) return;
    if (S.modal !== currentModal) {
      currentModal = S.modal;
      host.innerHTML = S.modal ? modalShell(S.modal) : "";
    }
    if (S.modal) {
      var body = $("#fd-modal-body");
      if (body) body.innerHTML = modalBody(S.modal);
    }
  }

  function rememberScroll() {
    ["list", "thread"].forEach(function (key) {
      var node = root.querySelector('[data-scroll="' + key + '"]');
      if (node) scrolls[key] = node.scrollTop;
    });
  }
  function restoreScroll() {
    var list = root.querySelector('[data-scroll="list"]');
    if (list && scrolls.list) list.scrollTop = scrolls.list;
    var thread = root.querySelector('[data-scroll="thread"]');
    if (thread) {
      thread.scrollTop = pinThread ? thread.scrollHeight : (scrolls.thread || 0);
      pinThread = false;
      scrolls.thread = thread.scrollTop;
    }
  }

  function grow(node) {
    node.style.height = "auto";
    node.style.height = Math.min(node.scrollHeight, 160) + "px";
  }

  function crash(err) {
    try {
      root.innerHTML = '<div class="fd-crash"><h2>The desk hit a snag.</h2>' +
        "<p>Your tickets are still saved in this browser. Reload to try again \u2014 if it keeps " +
        "happening, copy your data out with the button below and send it along.</p>" +
        '<button class="fd-btn fd-btn-solid" id="fd-rescue">Copy my data</button></div>';
      var b = document.getElementById("fd-rescue");
      if (b) b.onclick = function () {
        var raw = readStore().value || "{}";
        if (navigator.clipboard) navigator.clipboard.writeText(raw);
        b.textContent = "Copied";
      };
      if (window.console) console.error(err);
    } catch (e) { /* nothing left to do */ }
  }

  /* ---------- actions ----------------------------------------------------- */
  function openTicket(id) {
    var t = ticketById(id);
    if (!t) return;
    S.selected = id;
    S.tab = t.status === "closed" ? "archive" : "queue";
    S.pane = "detail";
    S.editing = null; S.confirmMsg = null; S.confirmDel = null;
    S.deadlineEdit = false; S.sender = "agent";
    pinThread = true;
    persist();
    render(["qhead", "flavors", "list", "detail"]);
  }

  function setStatus(id, status) {
    var at = Date.now();
    updateTicket(id, function (t) {
      return Object.assign({}, t, {
        status: status,
        updatedAt: at,
        closedAt: status === "closed" ? at : null,
        spawnedAt: status === "closed" ? t.spawnedAt : null
      });
    });
    if (status === "closed") { S.selected = null; S.pane = "list"; }
    render();
  }

  function sendMessage() {
    var t = ticketById(S.selected);
    if (!t) return;
    var text = (S.drafts[t.id] || "").trim();
    if (!text) return;
    var at = Date.now();
    delete S.drafts[t.id];
    updateTicket(t.id, function (x) {
      return Object.assign({}, x, {
        updatedAt: at,
        messages: x.messages.concat([{ id: uid(), from: S.sender, text: text, at: at }])
      });
    });
    pinThread = true;
    render(["list", "detail"]);
  }

  function createTicket() {
    var f = S.form;
    if (!f.subject.trim()) return;
    var at = Date.now();
    var due = durationFrom(f.hrs, f.mins);
    var ticket = {
      id: "t_" + uid(),
      subject: f.subject.trim(),
      requester: f.requester.trim() || "Anonymous",
      dex: f.dex || undefined,
      flavor: f.flavor,
      urgency: f.urgency,
      magnitude: f.magnitude,
      dueAt: due ? at + due : null,
      dueAck: false,
      repeat: f.repeat || null,
      closedAt: null,
      spawnedAt: null,
      status: "open",
      createdAt: at,
      updatedAt: at,
      messages: f.first.trim() ? [{ id: uid(), from: "requester", text: f.first.trim(), at: at }] : []
    };
    S.tickets = [ticket].concat(S.tickets);
    S.modal = null;
    S.form = null;
    S.tab = "queue";
    S.query = "";
    S.flavor = null;
    S.selected = ticket.id;
    S.pane = "detail";
    pinThread = true;
    persist();
    render();
  }

  function applyImport(list) {
    snapshot("Backup loaded");
    S.tickets = list;
    S.selected = null;
    S.pane = "list";
    S.tab = "queue";
    S.query = "";
    S.flavor = null;
    S.modal = null;
    S.backup = { paste: "", error: "", pending: null };
    persist();
    render();
  }

  function backupJSON() {
    return JSON.stringify({
      app: "pokemon-frontdesk",
      version: 2,
      exportedAt: new Date().toISOString(),
      tickets: S.tickets
    }, null, 2);
  }

  function moveSelection(step) {
    var rows = visibleTickets();
    if (!rows.length) return;
    var idx = rows.map(function (t) { return t.id; }).indexOf(S.selected);
    var next = rows[idx < 0 ? 0 : Math.min(rows.length - 1, Math.max(0, idx + step))];
    if (!next) return;
    S.selected = next.id;
    S.editing = null;
    pinThread = true;
    persist();
    render(["list", "detail"]);
    var card = root.querySelector(".fd-card.is-on");
    if (card && card.scrollIntoView) card.scrollIntoView({ block: "nearest" });
  }

  /* ---------- events -------------------------------------------------------- */
  var ACTIONS = {
    theme: function () {
      S.theme = S.theme === "dark" ? "light" : "dark";
      persist();
      render();
    },
    dismissWarn: function () { S.warnDismissed = true; render(["warn"]); },
    tab: function (el) {
      S.tab = el.getAttribute("data-v");
      S.flavor = null;
      persist();
      render(["qhead", "flavors", "list"]);
    },
    filterFlavor: function (el) {
      var v = el.getAttribute("data-v");
      S.flavor = S.flavor === v ? null : v;
      persist();
      render(["flavors", "list"]);
    },
    clearFilters: function () {
      S.query = ""; S.flavor = null;
      var box = root.querySelector('[data-k="search"]');
      if (box) box.value = "";
      syncClear();
      render(["flavors", "list"]);
    },
    clearSearch: function () {
      S.query = "";
      var box = root.querySelector('[data-k="search"]');
      if (box) { box.value = ""; box.focus(); }
      syncClear();
      render(["flavors", "list"]);
    },
    showOverdue: function () {
      S.tab = "queue"; S.sort = "deadline"; S.flavor = null;
      persist();
      render(["qhead", "flavors", "list"]);
      var sel = root.querySelector('[data-role="sort"]');
      if (sel) sel.value = "deadline";
    },
    open: function (el) { openTicket(el.getAttribute("data-id")); },
    back: function () { S.pane = "list"; render(["detail"]); },
    extras: function () { S.extras = !S.extras; render(["detail"]); },
    setFlavor: function (el) {
      updateTicket(S.selected, function (t) {
        return Object.assign({}, t, { flavor: el.getAttribute("data-v") });
      });
      render(["flavors", "list", "detail"]);
    },
    setRepeat: function (el) {
      var v = el.getAttribute("data-v") || null;
      updateTicket(S.selected, function (t) { return Object.assign({}, t, { repeat: v }); });
      render(["list", "detail"]);
    },
    deadlineEdit: function () {
      var t = ticketById(S.selected);
      var left = t && t.dueAt ? Math.max(0, t.dueAt - Date.now()) : 0;
      S.dHrs = left ? String(Math.floor(left / HOUR)) : "";
      S.dMins = left ? String(Math.floor((left % HOUR) / MINUTE)) : "";
      S.deadlineEdit = true;
      render(["detail"]);
    },
    deadlineCancel: function () { S.deadlineEdit = false; render(["detail"]); },
    deadlineSet: function () {
      var ms = durationFrom(S.dHrs, S.dMins);
      setDeadline(ms);
    },
    deadlinePreset: function (el) { setDeadline(Number(el.getAttribute("data-v"))); },
    deadlineClear: function () { setDeadline(null); },
    deadlineAck: function () {
      updateTicket(S.selected, function (t) { return Object.assign({}, t, { dueAck: true }); });
      render(["top", "list", "detail"]);
    },
    projMove: function (el) {
      var t = ticketById(S.selected);
      var group = projectOf(t);
      var idx = group.map(function (x) { return x.id; }).indexOf(t.id);
      var step = Number(el.getAttribute("data-v"));
      openTicket(group[(idx + step + group.length) % group.length].id);
    },
    closeTicket: function () { setStatus(S.selected, "closed"); },
    reopenTicket: function () { setStatus(S.selected, "open"); },
    askDelTicket: function () { S.confirmDel = S.selected; render(["detail"]); },
    cancelDel: function () { S.confirmDel = null; render(["detail", "foot"]); },
    delTicket: function () {
      var id = S.selected;
      snapshot("Ticket deleted");
      S.tickets = S.tickets.filter(function (t) { return t.id !== id; });
      S.selected = null;
      S.confirmDel = null;
      S.pane = "list";
      persist();
      render();
    },
    askClearAll: function () { S.confirmDel = "all"; render(["foot"]); },
    clearAll: function () {
      snapshot("Desk cleared");
      S.tickets = [];
      S.selected = null;
      S.confirmDel = null;
      S.pane = "list";
      persist();
      render();
    },
    undo: function () {
      if (!S.undo) return;
      S.tickets = S.undo.tickets;
      S.undo = null;
      clearTimeout(undoTimer);
      persist();
      render();
    },
    sender: function (el) { S.sender = el.getAttribute("data-v"); render(["detail"]); },
    send: sendMessage,
    editMsg: function (el) {
      var t = ticketById(S.selected);
      var id = el.getAttribute("data-id");
      var msg = t && t.messages.filter(function (m) { return m.id === id; })[0];
      if (!msg) return;
      S.confirmMsg = null;
      S.editing = id;
      S.editText = msg.text;
      render(["detail"]);
      var box = root.querySelector('[data-k="edit"]');
      if (box) { box.focus(); box.setSelectionRange(box.value.length, box.value.length); }
    },
    cancelEdit: function () { S.editing = null; S.editText = ""; render(["detail"]); },
    saveEdit: saveEdit,
    askDelMsg: function (el) { S.confirmMsg = el.getAttribute("data-id"); render(["detail"]); },
    keepMsg: function () { S.confirmMsg = null; render(["detail"]); },
    delMsg: function (el) {
      var id = el.getAttribute("data-id");
      var at = Date.now();
      updateTicket(S.selected, function (t) {
        return Object.assign({}, t, {
          updatedAt: at,
          messages: t.messages.filter(function (m) { return m.id !== id; })
        });
      });
      S.confirmMsg = null;
      if (S.editing === id) { S.editing = null; S.editText = ""; }
      render(["list", "detail"]);
    },

    newTicket: function () {
      S.form = blankForm();
      S.modal = "new";
      render(["modal"]);
      var box = root.querySelector('[data-k="requester"]');
      if (box) box.focus();
    },
    closeModal: function () {
      S.modal = null;
      S.form = null;
      S.backup = { paste: "", error: "", pending: null };
      render(["modal"]);
    },
    scrim: function () { ACTIONS.closeModal(); },
    formFlavor: function (el) { S.form.flavor = el.getAttribute("data-v"); render(["modal"]); },
    formRepeat: function (el) { S.form.repeat = el.getAttribute("data-v"); render(["modal"]); },
    pickMon: function (el) {
      var dex = Number(el.getAttribute("data-dex"));
      S.form.requester = MON_NAMES[dex - 1];
      S.form.dex = dex;
      S.form.pickerOpen = false;
      render(["modal"]);
      var box = root.querySelector('[data-k="subject"]');
      if (box) box.focus();
    },
    createTicket: createTicket,

    backup: function () {
      S.modal = "backup";
      S.backup = { paste: "", error: "", pending: null };
      S.copied = false;
      render(["modal"]);
    },
    download: function () {
      try {
        var blob = new Blob([backupJSON()], { type: "application/json" });
        var url = URL.createObjectURL(blob);
        var a = document.createElement("a");
        a.href = url;
        a.download = "pokemon-frontdesk-" + new Date().toISOString().slice(0, 10) + ".json";
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
      } catch (e) {
        S.backup.error = "Download is blocked here. Copy the text instead.";
        render(["modal"]);
      }
    },
    copyJson: function () {
      var done = function () { S.copied = true; render(["modal"]); setTimeout(function () {
        S.copied = false; if (S.modal === "backup") render(["modal"]);
      }, 1600); };
      try {
        navigator.clipboard.writeText(backupJSON()).then(done, function () {
          S.backup.error = "Copying is blocked here. Select the text and copy it manually.";
          render(["modal"]);
        });
      } catch (e) {
        S.backup.error = "Copying is blocked here. Select the text and copy it manually.";
        render(["modal"]);
      }
    },
    checkPaste: function () { checkBackup(S.backup.paste); },
    applyImport: function () { if (S.backup.pending) applyImport(S.backup.pending); },
    cancelImport: function () { S.backup.pending = null; render(["modal"]); }
  };

  function setDeadline(ms) {
    updateTicket(S.selected, function (t) {
      return Object.assign({}, t, { dueAt: ms === null ? null : Date.now() + ms, dueAck: false });
    });
    S.deadlineEdit = false;
    render(["top", "list", "detail"]);
  }

  function saveEdit() {
    var text = S.editText.trim();
    if (!text || !S.editing) return;
    var at = Date.now();
    var id = S.editing;
    updateTicket(S.selected, function (t) {
      return Object.assign({}, t, {
        updatedAt: at,
        messages: t.messages.map(function (m) {
          return m.id === id ? Object.assign({}, m, { text: text, editedAt: at }) : m;
        })
      });
    });
    S.editing = null;
    S.editText = "";
    render(["list", "detail"]);
  }

  function checkBackup(text) {
    S.backup.error = "";
    S.backup.pending = null;
    try {
      S.backup.pending = coerceTickets(JSON.parse(text));
    } catch (err) {
      S.backup.error = err && err.message === "No tickets in that file."
        ? err.message : "That doesn\u2019t look like a Frontdesk backup.";
    }
    render(["modal"]);
  }

  function bindEvents() {
    root.addEventListener("click", function (ev) {
      var el = ev.target.closest ? ev.target.closest("[data-act]") : null;
      if (!el || !root.contains(el)) return;
      var act = el.getAttribute("data-act");
      if (act === "scrim" && ev.target !== el) return;   /* click landed inside the sheet */
      var fn = ACTIONS[act];
      if (!fn) return;
      if (el.tagName === "BUTTON") ev.preventDefault();  /* labels keep their default */
      harvest();
      fn(el, ev);
    });

    /* keep the drag alive: sliders update in place and only settle on release */
    root.addEventListener("input", function (ev) {
      var el = ev.target;
      if (el.getAttribute && el.getAttribute("data-role") === "dial") {
        var value = clampStep(el.value);
        el.style.setProperty("--pct", value + "%");
        var label = el.parentNode.querySelector(".fd-urgency-value");
        if (label) label.textContent = value;
        var name = el.getAttribute("data-dial");
        if (name.indexOf("form.") === 0) S.form[name.slice(5)] = value;
        else if (S.selected) {
          updateTicket(S.selected, function (t) {
            var patch = {}; patch[name] = value;
            return Object.assign({}, t, patch);
          });
        }
        return;
      }
      if (!el.getAttribute || !el.getAttribute("data-bind")) return;
      setPath(el.getAttribute("data-bind"), el.value);
      var role = el.getAttribute("data-role");
      if (role === "composer") {
        grow(el);
        var send = root.querySelector('[data-act="send"]');
        if (send) send.disabled = !el.value.trim();
      } else if (role === "edit") {
        var save = root.querySelector('[data-act="saveEdit"]');
        if (save) save.disabled = !el.value.trim();
      } else if (role === "paste") {
        var check = root.querySelector('[data-act="checkPaste"]');
        if (check) check.disabled = !el.value.trim();
      } else if (role === "subject") {
        var make = root.querySelector('[data-act="createTicket"]');
        if (make) make.disabled = !el.value.trim();
      } else if (role === "requester") {
        S.form.dex = null;
        S.form.pickerOpen = true;
        S.form.pickerIndex = 0;
        render(["modal"]);
      } else if (el.getAttribute("data-live")) {
        syncClear();
        render(["flavors", "list"]);
      }
    });

    root.addEventListener("change", function (ev) {
      var el = ev.target;
      if (el.getAttribute && el.getAttribute("data-role") === "dial") { render(["list"]); return; }
      if (el.getAttribute && el.getAttribute("data-role") === "sort") {
        if (SORT_IDS[el.value]) S.sort = el.value;
        persist();
        render(["list"]);
        return;
      }
      if (el.getAttribute && el.getAttribute("data-role") === "importFile") {
        var file = el.files && el.files[0];
        el.value = "";                       /* so the same file can be picked twice */
        if (!file) return;
        var reader = new FileReader();
        reader.onload = function () { checkBackup(String(reader.result)); };
        reader.onerror = function () {
          S.backup.error = "That file could not be read.";
          render(["modal"]);
        };
        reader.readAsText(file);
      }
    });

    /* touch keeps focus on the field, so the list survives long enough to tap */
    root.addEventListener("pointerdown", function (ev) {
      var opt = ev.target.closest ? ev.target.closest(".fd-option") : null;
      if (opt) ev.preventDefault();
    });

    root.addEventListener("focusout", function (ev) {
      if (!S.form || !S.form.pickerOpen) return;
      if (ev.target.getAttribute && ev.target.getAttribute("data-role") === "requester") {
        setTimeout(function () {
          if (!S.form) return;
          var box = root.querySelector('[data-k="requester"]');
          if (box && document.activeElement === box) return;
          S.form.pickerOpen = false;
          render(["modal"]);
        }, 120);
      }
    });

    root.addEventListener("keydown", function (ev) {
      var el = ev.target;
      var role = el.getAttribute ? el.getAttribute("data-role") : null;

      if (role === "requester" && S.form) {
        var options = S.form.pickerOpen ? searchMons(S.form.requester) : [];
        if (options.length) {
          if (ev.key === "ArrowDown") {
            ev.preventDefault();
            S.form.pickerIndex = (S.form.pickerIndex + 1) % options.length;
            render(["modal"]); scrollOption(); return;
          }
          if (ev.key === "ArrowUp") {
            ev.preventDefault();
            S.form.pickerIndex = (S.form.pickerIndex - 1 + options.length) % options.length;
            render(["modal"]); scrollOption(); return;
          }
          if (ev.key === "Enter") {
            ev.preventDefault();
            var pick = options[S.form.pickerIndex];
            S.form.requester = pick.name;
            S.form.dex = pick.dex;
            S.form.pickerOpen = false;
            render(["modal"]);
            var subject = root.querySelector('[data-k="subject"]');
            if (subject) subject.focus();
            return;
          }
          if (ev.key === "Escape") {
            ev.stopPropagation();
            S.form.pickerOpen = false;
            render(["modal"]);
            return;
          }
        }
      }

      if (role === "subject" && ev.key === "Enter") {
        ev.preventDefault();
        harvest();
        createTicket();
        return;
      }
      if (role === "composer" && ev.key === "Enter" && !ev.shiftKey && !ev.isComposing) {
        ev.preventDefault();
        harvest();
        sendMessage();
        return;
      }
      if (role === "edit") {
        if (ev.key === "Enter" && !ev.shiftKey && !ev.isComposing) {
          ev.preventDefault(); harvest(); saveEdit(); return;
        }
        if (ev.key === "Escape") {
          ev.stopPropagation();
          S.editing = null; S.editText = "";
          render(["detail"]);
          return;
        }
      }
    });
  }

  function syncClear() {
    var clear = root.querySelector(".fd-search-clear");
    var box = root.querySelector('[data-k="search"]');
    if (clear && box) clear.hidden = !box.value;
  }

  function scrollOption() {
    var on = root.querySelector(".fd-option.is-on");
    if (on && on.scrollIntoView) on.scrollIntoView({ block: "nearest" });
  }

  function bindShortcuts() {
    window.addEventListener("keydown", function (ev) {
      var el = ev.target;
      var tag = el && el.tagName ? el.tagName.toLowerCase() : "";
      var typing = tag === "input" || tag === "textarea" || tag === "select" ||
        (el && el.isContentEditable);

      if ((ev.metaKey || ev.ctrlKey) && (ev.key === "k" || ev.key === "K")) {
        ev.preventDefault();
        var box = root.querySelector('[data-k="search"]');
        if (box) { box.focus(); box.select(); }
        return;
      }
      if (ev.key === "Escape") {
        if (S.modal) { ACTIONS.closeModal(); return; }
        if (typing && tag !== "input") return;
        if (typing) { el.blur(); return; }
        if (S.selected) { S.selected = null; S.pane = "list"; persist(); render(["list", "detail"]); }
        return;
      }
      if (S.modal || typing || ev.metaKey || ev.ctrlKey || ev.altKey) return;

      if (ev.key === "n" || ev.key === "N") { ev.preventDefault(); ACTIONS.newTicket(); }
      else if (ev.key === "/") {
        ev.preventDefault();
        var search = root.querySelector('[data-k="search"]');
        if (search) search.focus();
      }
      else if (ev.key === "j" || ev.key === "ArrowDown") { ev.preventDefault(); moveSelection(1); }
      else if (ev.key === "k" || ev.key === "ArrowUp") { ev.preventDefault(); moveSelection(-1); }
    });
  }

  /* ---------- shell --------------------------------------------------------- */
  function shell() {
    return '<svg width="0" height="0" style="position:absolute" aria-hidden="true"><filter id="fd-ink" x="-20%" y="-20%" width="140%" height="140%">' +
        '<feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="4" result="n"/>' +
        '<feDisplacementMap in="SourceGraphic" in2="n" scale="2.4"/>' +
      "</filter></svg>" +
      '<header class="fd-topbar" id="fd-top"></header>' +
      '<div id="fd-warn"></div>' +
      '<main class="fd-app" id="fd-app" data-pane="list">' +
        '<section class="fd-queue">' +
          '<div class="fd-queue-head" id="fd-qhead"></div>' +
          '<div class="fd-search-wrap">' +
            '<div class="fd-search-field">' +
              '<input class="fd-search" placeholder="Search tickets" aria-label="Search tickets" ' +
                'data-bind="query" data-live="1" data-k="search">' +
              '<button class="fd-search-clear" data-act="clearSearch" aria-label="Clear search" hidden>\u00d7</button>' +
            "</div>" +
            '<select class="fd-sort" aria-label="Sort tickets" data-role="sort">' +
              SORTS.map(function (s) { return '<option value="' + s.id + '">' + s.label + "</option>"; }).join("") +
            "</select>" +
          "</div>" +
          '<div class="fd-flavorbar" id="fd-flavors"></div>' +
          '<div class="fd-list" id="fd-list" data-scroll="list"></div>' +
          benchHTML(5) +
        "</section>" +
        '<section class="fd-detail" id="fd-detail"></section>' +
      "</main>" +
      '<footer class="fd-footer" id="fd-foot"></footer>' +
      '<div id="fd-undo"></div>' +
      '<div id="fd-layer"></div>';
  }

  /* ---------- boot ----------------------------------------------------------- */
  function prefersDark() {
    try { return window.matchMedia("(prefers-color-scheme: dark)").matches; }
    catch (e) { return false; }
  }

  function boot() {
    var mount = document.getElementById("root");
    if (!mount) return;
    root = document.createElement("div");
    root.className = "fd-root";
    root.innerHTML = '<div class="fd-boot">Opening the desk\u2026</div>';
    mount.appendChild(root);

    var res = readStore();
    var prefs = null;
    if (res.value) {
      try {
        var parsed = JSON.parse(res.value);
        S.tickets = coerceTickets(parsed);
        prefs = parsed.prefs || null;
      } catch (e) { S.tickets = []; }
    }
    S.saveOk = res.ok;
    S.theme = prefs && (prefs.theme === "dark" || prefs.theme === "light")
      ? prefs.theme : (prefersDark() ? "dark" : "light");
    if (prefs) {
      if (SORT_IDS[prefs.sort]) S.sort = prefs.sort;
      if (prefs.tab === "archive") S.tab = "archive";
      if (prefs.flavor && FLAVOR_BY_ID[prefs.flavor]) S.flavor = prefs.flavor;
      if (prefs.selected && ticketById(prefs.selected)) S.selected = prefs.selected;
    }
    S.ready = true;

    root.setAttribute("data-theme", S.theme);
    root.innerHTML = shell();
    var sortBox = root.querySelector('[data-role="sort"]');
    if (sortBox) sortBox.value = S.sort;
    bindEvents();
    bindShortcuts();
    runRespawns();
    render();
    persist();          /* write the repaired shape back, so damage doesn't linger */

    /* the clock only ticks the parts that show elapsed time */
    setInterval(function () {
      S.now = Date.now();
      var changed = runRespawns();
      render(changed ? ["top", "qhead", "flavors", "list", "detail"] : ["top", "list", "detail"]);
    }, 30000);

    /* a debounced save must never outlive the tab */
    window.addEventListener("pagehide", flushPersist);
    window.addEventListener("beforeunload", flushPersist);
    document.addEventListener("visibilitychange", function () {
      if (document.visibilityState === "hidden") flushPersist();
    });

    /* only fight the layout when a soft keyboard is actually covering it */
    var vv = window.visualViewport;
    if (vv) {
      var syncViewport = function () {
        var covered = window.innerHeight - vv.height;
        if (covered > 120) {
          root.style.height = vv.height + "px";
          root.style.bottom = "auto";
        } else {
          root.style.height = "";
          root.style.bottom = "";
        }
        var thread = root.querySelector('[data-scroll="thread"]');
        if (thread) thread.scrollTop = thread.scrollHeight;
      };
      vv.addEventListener("resize", syncViewport);
    }
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
    </script>
  </body>
</html>
