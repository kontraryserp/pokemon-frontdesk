  --surface: #FFFFFF;
  --ink: #15191E;
  --muted: #6C7580;
  --faint: #9AA2AC;
  --line: #E7EAEE;
  --danger: #B04A4A;
  --sheet: url("sprites.webp");
  --flavor: #C2548B;
  --flavor-soft: #FBF0F6;
  --body: 'Instrument Sans', system-ui, -apple-system, sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, monospace;
  position: absolute; inset: 0;
  display: flex; flex-direction: column; overflow: hidden;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--body);
  font-size: 15px;
  -webkit-font-smoothing: antialiased;
}
.fd-root *, .fd-root *::before, .fd-root *::after { box-sizing: border-box; }
.fd-root button { font-family: inherit; cursor: pointer; }
.fd-root :focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.fd-boot { margin: auto; font-family: var(--mono); font-size: 12px; color: var(--faint); }

/* topbar */
.fd-topbar {
  flex: none; display: flex; align-items: center; justify-content: space-between;
  gap: 12px; padding: 13px 22px; background: var(--surface);
  border-bottom: 1px solid var(--line);
}
.fd-brand { display: flex; align-items: center; gap: 9px; min-width: 0; }
.fd-brand-mark {
  flex: none; position: relative; width: 13px; height: 13px; border-radius: 50%;
  border: 1.5px solid var(--ink);
  background: linear-gradient(#D8493E 0 46%, var(--ink) 46% 54%, #FFF 54% 100%);
}
.fd-brand-mark::after {
  content: ""; position: absolute; left: 50%; top: 50%;
  width: 4px; height: 4px; margin: -2px 0 0 -2px;
  border-radius: 50%; background: #fff; border: 1.5px solid var(--ink);
}
.fd-topbar h1 {
  margin: 0; font-size: 14.5px; font-weight: 600; letter-spacing: -0.005em;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.fd-version {
  flex: none; font-family: var(--mono); font-size: 9.5px; letter-spacing: .06em;
  color: var(--faint); border: 1px solid var(--line);
  border-radius: 999px; padding: 1px 6px;
}
.fd-readout {
  flex: none; font-family: var(--mono); font-size: 11px; color: var(--faint);
  white-space: nowrap;
}
.fd-readout span:first-child { color: var(--muted); }
.fd-readout-sep { margin: 0 5px; opacity: .5; }

.fd-warn {
  flex: none; display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 8px 22px; background: #FAF4E6; border-bottom: 1px solid #EDE2C8;
  font-size: 12.5px; color: #6E5518;
}
.fd-warn button {
  flex: none; border: none; background: none; padding: 0;
  font-size: 12.5px; font-weight: 600; color: inherit; text-decoration: underline;
}

/* layout */
.fd-app { flex: 1; display: grid; grid-template-columns: 348px 1fr; min-height: 0; }

/* queue */
.fd-queue {
  display: flex; flex-direction: column; min-height: 0;
  border-right: 1px solid var(--line); background: var(--bg);
}
.fd-queue-head {
  flex: none; display: flex; align-items: center; justify-content: space-between;
  gap: 8px; padding: 16px 18px 12px;
}
.fd-tabs { display: flex; gap: 16px; }
.fd-tab {
  border: none; background: none; padding: 2px 0;
  font-size: 13px; font-weight: 500; color: var(--faint);
}
.fd-tab.is-on { color: var(--ink); }
.fd-new {
  border: 1px solid var(--ink); background: var(--ink); color: #fff;
  border-radius: 999px; padding: 6px 14px; font-size: 12.5px; font-weight: 500;
  white-space: nowrap;
}
.fd-new:hover { background: #2B333C; border-color: #2B333C; }
.fd-search-wrap { flex: none; padding: 0 18px 10px; }
.fd-search {
  width: 100%; border: 1px solid var(--line); background: var(--surface);
  border-radius: 9px; padding: 9px 12px; font-family: var(--body); font-size: 16px;
  color: var(--ink);
}
.fd-search::placeholder { color: var(--faint); }
.fd-search:focus { outline: none; border-color: #C9D0D8; }

/* the five categories */
.fd-flavorbar { display: flex; flex-wrap: wrap; gap: 5px; }
.fd-queue .fd-flavorbar { flex: none; padding: 0 18px 12px; }
/* the label carries its own colour, so the row doubles as the legend */
.fd-flavorchip {
  border: 1px solid var(--line); background: var(--surface); color: var(--flavor);
  border-radius: 999px; padding: 4px 11px; font-size: 11.5px; font-weight: 500;
}
.fd-flavorchip:hover { border-color: var(--flavor); }
.fd-flavorchip.is-on { background: var(--flavor-soft); border-color: var(--flavor); }

.fd-list { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 0 14px 14px; }
.fd-card {
  display: block; width: 100%; text-align: left; margin-bottom: 7px;
  background: var(--surface); border: 1px solid var(--line);
  border-left: 3px solid var(--flavor); border-radius: 10px; padding: 12px 14px;
}
.fd-card:hover { border-color: #D5DBE1; border-left-color: var(--flavor); }
.fd-card.is-on {
  background: var(--flavor-soft); border-color: var(--flavor); border-left-color: var(--flavor);
}
.fd-card-body { display: flex; gap: 12px; align-items: flex-start; }
.fd-card-text { min-width: 0; }
.fd-card h3 {
  margin: 0; font-size: 14.5px; font-weight: 600; line-height: 1.3; letter-spacing: -0.005em;
  overflow: hidden; text-overflow: ellipsis; display: -webkit-box;
  -webkit-line-clamp: 2; -webkit-box-orient: vertical;
}
.fd-card-meta { margin: 4px 0 0; font-size: 12px; color: var(--muted); }

/* urgency */
.fd-bar {
  height: 3px; margin-top: 11px; border-radius: 999px;
  background: var(--line); overflow: hidden;
}
.fd-bar-fill { height: 100%; background: var(--flavor); border-radius: 999px; }

.fd-urgency { display: flex; align-items: center; gap: 10px; max-width: 260px; }
.fd-urgency-value {
  flex: none; min-width: 22px; text-align: right;
  font-family: var(--mono); font-size: 10.5px; color: var(--muted);
}
.fd-range {
  -webkit-appearance: none; appearance: none;
  flex: 1; min-width: 0; height: 18px; background: transparent; cursor: pointer;
}
.fd-range::-webkit-slider-runnable-track {
  height: 4px; border-radius: 999px;
  background: linear-gradient(to right, var(--flavor) var(--pct), var(--line) var(--pct));
}
.fd-range::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none; margin-top: -5px;
  width: 14px; height: 14px; border-radius: 50%;
  background: var(--surface); border: 2px solid var(--flavor);
}
.fd-range::-moz-range-track { height: 4px; border-radius: 999px; background: var(--line); }
.fd-range::-moz-range-progress { height: 4px; border-radius: 999px; background: var(--flavor); }
.fd-range::-moz-range-thumb {
  width: 12px; height: 12px; border-radius: 50%;
  background: var(--surface); border: 2px solid var(--flavor);
}
.fd-range:focus { outline: none; }
.fd-range:focus-visible::-webkit-slider-thumb { box-shadow: 0 0 0 4px rgba(21,25,30,.14); }
.fd-range:focus-visible::-moz-range-thumb { box-shadow: 0 0 0 4px rgba(21,25,30,.14); }

.fd-detail-title .fd-urgency { margin-top: 8px; }
.fd-field .fd-urgency { max-width: none; }

/* avatars: --s drives every dimension, so one component serves every size */
.fd-avatar {
  --s: 48px;
  flex: none; width: var(--s); height: var(--s); border-radius: 9px; overflow: hidden;
  display: grid; place-items: center; color: #fff;
  font-family: var(--mono); font-size: calc(var(--s) * 0.3); letter-spacing: .02em;
}
.fd-avatar-poke {
  background-color: transparent; background-image: var(--sheet); background-repeat: no-repeat;
  background-size: calc(var(--s) * 32) calc(var(--s) * 33);
  background-position: calc(var(--c) * var(--s) * -1) calc(var(--r) * var(--s) * -1);
  image-rendering: pixelated;
}
.fd-avatar-lg { --s: 96px; }
.fd-avatar-sm { --s: 48px; }

.fd-empty, .fd-detail-empty { padding: 24px 18px; color: var(--muted); font-size: 13.5px; line-height: 1.55; }
.fd-empty p, .fd-detail-empty p { margin: 0 0 4px; }
.fd-empty-lead { font-size: 15px; color: var(--ink); font-weight: 600; }

.fd-footer {
  flex: none; display: flex; align-items: center; justify-content: space-between;
  gap: 12px; padding: 8px 22px; background: var(--bg); border-top: 1px solid var(--line);
}
.fd-credit { font-size: 11px; color: var(--faint); }
.fd-footer-actions { display: flex; align-items: center; gap: 16px; }
.fd-quiet { flex: none; border: none; background: none; padding: 0; font-size: 11px; color: var(--faint); }
.fd-quiet:hover { color: var(--ink); }
.fd-confirm { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; font-size: 11px; }
.fd-confirm button { border: none; background: none; padding: 0; font-size: 11px; font-weight: 600; color: var(--muted); }
.fd-confirm-yes { color: var(--danger); }
.fd-confirm-no { color: var(--muted); }
.fd-confirm-lead { align-self: center; font-size: 12.5px; color: var(--muted); margin-right: 2px; }

/* detail */
.fd-detail { display: flex; flex-direction: column; min-height: 0; background: #FBFCFD; }
.fd-detail-empty { margin: auto; text-align: center; }
.fd-detail-head {
  flex: none; display: flex; align-items: center; gap: 16px;
  padding: 14px 26px; background: var(--surface); border-bottom: 1px solid var(--line);
}
.fd-back { display: none; }
.fd-detail-title { flex: 1; min-width: 0; }
.fd-detail-title h2 {
  margin: 0; font-size: 19px; font-weight: 600; line-height: 1.25; letter-spacing: -0.015em;
}
.fd-detail-meta { margin: 5px 0 0; font-size: 12.5px; color: var(--muted); }
.fd-closed-flag {
  font-family: var(--mono); font-size: 9.5px; letter-spacing: .1em; text-transform: uppercase;
  margin-left: 9px; padding: 2px 7px; border-radius: 999px;
  border: 1px solid var(--line); color: var(--faint);
}
.fd-flavorpick { display: flex; align-items: center; gap: 7px; margin-top: 9px; }
.fd-swatch {
  width: 13px; height: 13px; padding: 0; border-radius: 50%;
  border: none; background: var(--flavor); opacity: .28;
}
.fd-swatch:hover { opacity: .6; }
.fd-swatch.is-on { opacity: 1; box-shadow: 0 0 0 2px #fff, 0 0 0 3.5px var(--flavor); }
.fd-flavorname {
  margin-left: 4px; font-family: var(--mono); font-size: 10px;
  letter-spacing: .09em; text-transform: uppercase; color: var(--muted);
}

/* the header sits above a 96px sprite, so these stay quiet next to it */
.fd-detail-actions { flex: none; display: flex; align-items: center; gap: 12px; }
.fd-detail-actions .fd-btn { padding: 5px 12px; font-size: 12px; border-radius: 7px; }
.fd-btn-quiet {
  border: none; background: none; padding: 0;
  font-size: 12px; font-weight: 500; color: var(--muted); white-space: nowrap;
}
.fd-btn-quiet:hover { color: var(--ink); }
.fd-btn-quiet.fd-btn-danger { color: var(--danger); }
.fd-btn-quiet.fd-btn-danger:hover { color: #963E3E; }
.fd-btn {
  border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  border-radius: 8px; padding: 7px 13px; font-size: 12.5px; font-weight: 500;
  white-space: nowrap;
}
.fd-btn:hover { border-color: #C9D0D8; }
.fd-btn-solid { background: var(--ink); border-color: var(--ink); color: #fff; }
.fd-btn-solid:hover { background: #2B333C; border-color: #2B333C; }
.fd-btn:disabled { opacity: .35; cursor: not-allowed; }
.fd-btn-danger { color: var(--danger); }
.fd-btn-danger:hover { border-color: var(--danger); }
.fd-btn-danger-solid { background: var(--danger); border-color: var(--danger); color: #fff; }
.fd-btn-danger-solid:hover { background: #963E3E; border-color: #963E3E; }

.fd-thread {
  flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain; padding: 22px 26px;
}
.fd-thread-empty { font-size: 13.5px; color: var(--muted); }
.fd-msg { display: flex; gap: 12px; margin-bottom: 16px; max-width: 640px; }
.fd-msg.is-agent { margin-left: auto; justify-content: flex-end; }
.fd-bubble-wrap { min-width: 0; }
.fd-bubble-head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 5px; }
.fd-msg.is-agent .fd-bubble-head { justify-content: flex-end; }
.fd-bubble-who { font-size: 12.5px; font-weight: 600; }
.fd-bubble-when { font-family: var(--mono); font-size: 10px; color: var(--faint); }
.fd-bubble {
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
  padding: 11px 14px; font-size: 14px; line-height: 1.55; white-space: pre-wrap;
  overflow-wrap: anywhere;
}
.fd-msg.is-agent .fd-bubble { background: var(--flavor-soft); border-color: transparent; }

.fd-msg-tools {
  display: flex; align-items: center; gap: 12px; margin-top: 5px; min-height: 15px;
  opacity: 0; transition: opacity .12s ease;
}
.fd-msg.is-agent .fd-msg-tools { justify-content: flex-end; }
.fd-msg:hover .fd-msg-tools, .fd-msg:focus-within .fd-msg-tools { opacity: 1; }
.fd-tool { border: none; background: none; padding: 0; font-size: 11.5px; font-weight: 500; color: var(--faint); }
.fd-tool:hover { color: var(--ink); }
.fd-tool-danger:hover { color: var(--danger); }
.fd-tool-lead { font-size: 11.5px; color: var(--muted); }
.fd-edit { min-width: 280px; }
.fd-edit-foot { display: flex; justify-content: flex-end; gap: 7px; margin-top: 7px; }

.fd-composer {
  flex: none; background: var(--surface); border-top: 2px solid var(--flavor);
  padding: 12px 26px 14px;
}
.fd-composer-row { display: flex; align-items: center; gap: 12px; margin-bottom: 9px; }
.fd-switch { display: flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; min-width: 0; }
.fd-switch-half {
  border: none; background: var(--surface); color: var(--muted);
  padding: 5px 13px; font-size: 12px; font-weight: 500; max-width: 170px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.fd-switch-half.is-on { background: var(--flavor); color: #fff; }
.fd-hint { flex: 1; font-size: 11.5px; color: var(--faint); text-align: right; }
.fd-send { flex: none; }
.fd-input {
  width: 100%; border: 1px solid var(--line); border-radius: 10px;
  padding: 11px 13px; font-family: var(--body); font-size: 16px; line-height: 1.5;
  resize: vertical; color: var(--ink); background: var(--surface);
}
.fd-input:focus { outline: none; border-color: #C9D0D8; }

/* modal */
.fd-modal-scrim {
  position: absolute; inset: 0; background: rgba(21,25,30,.34);
  display: flex; align-items: center; justify-content: center; padding: 18px; z-index: 20;
}
.fd-modal {
  width: 100%; max-width: 470px; max-height: 100%; overflow-y: auto;
  background: var(--surface); border-radius: 16px; padding: 22px 24px 18px;
  box-shadow: 0 20px 50px rgba(21,25,30,.18);
}
.fd-modal h2 { margin: 0 0 12px; font-size: 18px; font-weight: 600; letter-spacing: -0.01em; }
.fd-modal-lead { margin: 0 0 16px; font-size: 13px; line-height: 1.55; color: var(--muted); }
.fd-modal-row { display: flex; gap: 8px; margin-bottom: 18px; }
.fd-modal-error { margin: 12px 0 0; font-size: 12.5px; color: var(--danger); }
.fd-modal-warn {
  display: flex; align-items: center; flex-wrap: wrap; gap: 9px;
  margin: 14px 0 0; padding: 11px 13px; border-radius: 10px;
  background: #FAF4E6; font-size: 12.5px; line-height: 1.5; color: #6E5518;
}
.fd-modal-warn button { border: none; background: none; padding: 0; font-size: 12.5px; font-weight: 600; }
.fd-field { display: block; margin-bottom: 15px; }
.fd-field > span {
  display: block; margin-bottom: 6px; font-family: var(--mono);
  font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--faint);
}
.fd-field .fd-field-note {
  margin: 6px 0 0; font-family: var(--body); font-size: 11.5px;
  letter-spacing: 0; text-transform: none; color: var(--faint);
}
.fd-field input, .fd-field textarea {
  width: 100%; border: 1px solid var(--line); border-radius: 9px;
  padding: 10px 12px; font-family: var(--body); font-size: 16px; color: var(--ink);
  resize: vertical; background: var(--surface);
}
.fd-field input:focus, .fd-field textarea:focus { outline: none; border-color: #C9D0D8; }
.fd-field input[type="file"] { padding: 8px 10px; font-size: 13px; }
.fd-field-row { display: flex; align-items: center; gap: 10px; }
.fd-picker { position: relative; }
.fd-options {
  position: absolute; z-index: 5; left: 0; right: 0; top: calc(100% + 5px);
  margin: 0; padding: 5px; list-style: none; max-height: 280px; overflow-y: auto;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
  box-shadow: 0 16px 34px rgba(21,25,30,.14);
}
.fd-option {
  color: var(--ink);
  display: flex; align-items: center; gap: 11px; width: 100%; text-align: left;
  border: none; background: none; border-radius: 9px; padding: 3px 7px;
}
.fd-option.is-on { background: var(--bg); }
.fd-option-name { flex: 1; font-size: 14px; }
.fd-option-dex { font-family: var(--mono); font-size: 10px; color: var(--faint); }
.fd-modal-foot { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }

/* phones: every fixed row above the thread gets smaller so the thread keeps
   the space, and the footer steps out of the way while a ticket is open */
@media (max-width: 800px) {
  .fd-app { grid-template-columns: 1fr; }
  .fd-app[data-pane="list"] .fd-detail { display: none; }
  .fd-app[data-pane="detail"] .fd-queue { display: none; }
  .fd-app[data-pane="detail"] ~ .fd-footer { display: none; }
  .fd-queue { border-right: none; }
  .fd-topbar { padding: 11px 16px; }
  .fd-queue-head { padding: 12px 16px 10px; }
  .fd-search-wrap, .fd-queue .fd-flavorbar { padding-left: 16px; padding-right: 16px; }
  .fd-list { padding: 0 12px 12px; }

  .fd-detail-head { flex-wrap: wrap; align-items: center; gap: 12px; padding: 8px 16px 10px; }
  .fd-back {
    display: block; width: 100%; border: none; background: none; padding: 2px 0;
    font-family: var(--mono); font-size: 11px; color: var(--muted); text-align: left;
  }
  .fd-avatar-lg { --s: 48px; }
  .fd-detail-title h2 { font-size: 16px; }
  .fd-detail-meta { margin-top: 2px; font-size: 11.5px; }
  .fd-flavorpick { margin-top: 7px; }
  .fd-detail-title .fd-urgency { margin-top: 6px; max-width: none; }
  .fd-range::-webkit-slider-thumb { width: 18px; height: 18px; margin-top: -7px; }
  .fd-range::-moz-range-thumb { width: 16px; height: 16px; }
  .fd-detail-actions { width: 100%; justify-content: flex-end; gap: 14px; }
  .fd-detail-actions .fd-btn { padding: 6px 14px; }

  .fd-thread { padding: 14px 16px; }
  .fd-msg { max-width: 100%; margin-bottom: 13px; gap: 10px; }
  .fd-composer { padding: 9px 16px 11px; }
  .fd-composer-row { margin-bottom: 7px; }
  .fd-hint { display: none; }
  .fd-edit { min-width: 0; }
  .fd-options { max-height: 210px; }
  .fd-modal { padding: 18px; }
}
@media (hover: none) {
  .fd-msg-tools { opacity: 1; }
}
@media (prefers-reduced-motion: no-preference) {
  .fd-card, .fd-btn, .fd-new, .fd-flavorchip, .fd-swatch { transition: background .15s ease, border-color .15s ease, opacity .15s ease; }
}
